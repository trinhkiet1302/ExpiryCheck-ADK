<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Đăng nhập ExpiryCheck để quản lý sản phẩm và theo dõi hạn sử dụng."
    />
    <meta
      name="keywords"
      content="đăng nhập ExpiryCheck, tài khoản quản lý sản phẩm, theo dõi hạn sử dụng"
    />
    <meta name="theme-color" content="#0f8f83" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="assets/images/ExpiryCheck.jpg" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <title>Đăng nhập ExpiryCheck</title>
    <link rel="stylesheet" href="assets/css/login.css" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="login-body ec-min-h-screen">
    <main class="login-box ec-w-[calc(100%-2rem)] ec-max-w-[410px]" aria-labelledby="loginTitle">
      <a class="login-logo ec-no-underline ec-text-inherit" href="index.html" aria-label="ExpiryCheck - Trang chủ">
        <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
        <h2>ExpiryCheck</h2>
      </a>

      <h1 id="loginTitle" data-i18n="login_title">Đăng Nhập</h1>
      <p class="local-profile-note" data-i18n="auth_local_note">
        Hồ sơ và dữ liệu chỉ được lưu trên trình duyệt của thiết bị này.
      </p>
      <form id="loginForm">
        <div class="input">
          <i class="fa-solid fa-user" aria-hidden="true"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Tên đăng nhập"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            aria-label="Tên đăng nhập"
            aria-describedby="errorMsg"
            required
            autofocus
            data-i18n-placeholder="login_username_ph"
          />
        </div>
        <div class="input">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mật khẩu"
            autocomplete="current-password"
            aria-label="Mật khẩu"
            aria-describedby="errorMsg"
            required
            data-i18n-placeholder="login_password_ph"
          />
        </div>
        <p
          class="error-msg"
          id="errorMsg"
          role="alert"
          aria-live="polite"
        ></p>
        <button type="submit" id="loginSubmit" data-i18n="login_submit_btn">
          Đăng Nhập
        </button>
        <p>
          <span data-i18n="login_no_account">Chưa có tài khoản?</span>
          <a
            href="dangky.html"
            id="registerLink"
            data-i18n="login_register_link"
            >Đăng ký</a
          >
        </p>
      </form>
    </main>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/motion.js"></script>
    <script src="assets/js/auth-pages.js"></script>
  </body>
</html>
