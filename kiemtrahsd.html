<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel = "icon" href = "ExpiryCheck.jpg">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="kthsd.css">
</head>
<body>
    <div class = "page-header-wrapper">
    <header>
         <nav class="navbar">
            <a class="logo">
                 <i class="fa-regular fa-calendar-check"></i>
                ExpiryCheck
            </a>
            <ul class = "nav-links">
                    <li><a href="index.html">Trang Chủ</a></li>
                    <li><a href="kiemtrahsd.html" class="active">Kiểm Tra Ngay</a></li>
                    <li><a href="tinhnang.html">Tính Năng</a></li>
                    <li><a href="huongdan.html">Hướng Dẫn</a></li>
                    <li><a href="gioithieu.html">Giới Thiệu</a></li>
            </ul>
            <div id = "navAuth">
                <a href="dangnhap.html" class="nutbam">Đăng Nhập | Đăng Ký</a>
            </div>
         </nav>
        </header>
    </div>
    <section class="hero-bg">
        <div class="welcome-badge"><i class="fa-solid fa-bolt"></i> Hệ thống nhận diện thời gian thực</div>
        <h1 class="hero-text-main">Kiểm Tra Hạn Sử Dụng</h1>
    </section>
    <div class="check-card">
        <h2 class="card-title"><i class="fa-solid fa-clipboard-check"></i> KIỂM TRA HẠN SỬ DỤNG SẢN PHẨM</h2>

        <div class="tab-bar">
            <button id="btn-tab-scan" class="tab-btn" onclick="switchTab('scan')">
                <i class="fa-solid fa-qrcode"></i> Quét Mã QR / Barcode
            </button>
            <button id="btn-tab-manual" class="tab-btn active" onclick="switchTab('manual')">
                <i class="fa-solid fa-pen-to-square"></i> Nhập Thủ Công
            </button>
        </div>
        <div id="scanner-container">
            <div id="reader"></div>
            <p style="margin-top: 12px; color:#666; font-size:13px;">
                <i class="fa-solid fa-camera"></i> Đưa mã QR của sản phẩm vào trước khung quét camera để nhận diện tự động.
            </p>
        </div>
        <div class="manual-form-content">
            <div class="form-group">
                <label><i class="fa-solid fa-box-open"></i> Tên sản phẩm</label>
                <input type="text" id="prodName" class="form-control" placeholder="Ví dụ: Sữa tươi Vinamilk, Kem chống nắng...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-day"></i> Ngày sản xuất (NSX)</label>
                    <input type="date" id="prodNSX" class="form-control">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-xmark"></i> Ngày hết hạn (HSD)</label>
                    <input type="date" id="prodHSD" class="form-control">
                </div>
            </div>

            <div class="check-buttons">

                <button class="btn-submit-check" onclick="checkExpiryDate()">
                    <i class="fa-solid fa-circle-play"></i>
                    BẮT ĐẦU KIỂM TRA
                </button>

                <button class="btn-save-product" onclick="saveCheckedProduct()">
                    <i class="fa-solid fa-bookmark"></i>
                    LƯU SẢN PHẨM
                </button>

            </div>
        </div>
        <div id="resultBox" class="result-alert"></div>
    </div>
    <script src ="auth.js"></script>
    <script src="kthsd.js"></script>
    <script>
            window.addEventListener("DOMContentLoaded", function (){
            const user = getCurrentUser();
            const navAuth = document.getElementById("navAuth");
            if(user && navAuth) {
                navAuth.innerHTML = `
                    <div class = "user-menu">
                        <i class="fa-solid fa-user"></i>
                        <span>Xin chào, ${user.fullName} </span>  
                        <button id = "logoutBtn" class = "logoutBtn">Đăng xuất</button>
                    </div>
                `;
                document.getElementById("logoutBtn").onclick = function() {
                    logoutUser();
                    location.href = "index.html";
                };
            }
        })
    </script>
</body>
</html>
